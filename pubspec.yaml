name: tiny_thinkers
description: "A new Flutter project for kids education."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.5.0 # Nastavil som stabilnú verziu Dartu, 3.9 ešte nie je bežná

dependencies:
  flutter:
    sdk: flutter
  # Balíček pre Google Fonty (Poppins vyzerá super)
  google_fonts: ^6.1.0
  # Ikony pre iOS štýl
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Linter pre kontrolu kvality kódu
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # TOTO JE KĽÚČOVÉ PRE TVOJE OBRÁZKY
  assets:
    - assets/images/